name: Weekly GEE Live Tests

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  live-gee:
    name: Live Earth Engine smoke tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gee]"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.WETLANDMAPPER_GEE_SERVICE_ACCOUNT }}

      - name: Run live GEE tests
        env:
          WETLANDMAPPER_RUN_GEE_LIVE: "1"
          WETLANDMAPPER_GEE_PROJECT: ${{ secrets.WETLANDMAPPER_GEE_PROJECT }}
        run: pytest tests/test_gee_live.py -m live_gee --tb=short
