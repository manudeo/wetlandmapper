name: Quarterly GEE Live Tests

on:
  schedule:
    - cron: "0 4 1 */3 *"
  workflow_dispatch:

jobs:
  gate:
    name: Check Earth Engine secrets
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          SERVICE_ACCOUNT: ${{ secrets.WETLANDMAPPER_GEE_SERVICE_ACCOUNT }}
          PROJECT: ${{ secrets.WETLANDMAPPER_GEE_PROJECT }}
        run: |
          if [ -n "$SERVICE_ACCOUNT" ] && [ -n "$PROJECT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Earth Engine secrets are not configured; skipping live tests."
          fi

  live-gee:
    name: Live Earth Engine smoke tests
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gee]"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.WETLANDMAPPER_GEE_SERVICE_ACCOUNT }}

      - name: Run live GEE tests
        env:
          WETLANDMAPPER_RUN_GEE_LIVE: "1"
          WETLANDMAPPER_GEE_PROJECT: ${{ secrets.WETLANDMAPPER_GEE_PROJECT }}
        run: pytest tests/test_gee_live.py -m live_gee --tb=short
